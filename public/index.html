<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2c8c" />
  <title>UU Bus ERP</title>
  <link rel="icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    try { var t = JSON.parse(localStorage.getItem('uubus.theme')); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <img src="/logo.png" alt="United University" class="splash-logo" />
      <div class="splash-title">UNITED <span>UNIVERSITY</span></div>
      <div class="splash-sub">Bus ERP · Transport &amp; Attendance</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/app.js"></script>
</body>
</html>
